# glitch defaults. Override any of these in ~/.config/glitch/glitch.conf
# (sourced after this file); `$DATA` is ~/.local/share/glitch.

WORKDIR="$HOME/Work"     # where the agent runs (its .claude/ config applies)
RESUME_WINDOW=900        # seconds after a turn that the next Super+D continues its session (and the phone keeps the last exchange)
CARD_SECONDS=900         # seconds the reply card stays on screen; 0 shows no card
TURN_TIMEOUT=1800        # seconds before a stuck agent turn is interrupted
RECORD_LIMIT=600         # voxtype's audio.max_duration_secs (install.sh sets 600)
SPEAK=1                  # read the SAY line aloud
BEEPS=1                  # play beep phrases
BEEP_VOLUME=2.0          # beep loudness multiplier, applied after the limiter
MIND=local              # decision model: local (glitch-mind) | jev | openai (keys: ~/.config/glitch/{typesafe,openai}.key)
JEV_MODEL=jev-latest
OPENAI_DECIDE_MODEL=gpt-6-luna
HISTORY_TURNS=1          # earlier turns (and their reactions) the decision model sees
LIVE_WORDS_INTERVAL=8    # seconds of streamed text between live decisions (tool steps always trigger one)
VOICE="$DATA/voices/en_US-kristin-medium.onnx"   # any Piper voice in $DATA/voices
MIND_PORT=8765           # glitch-mind's port on 127.0.0.1 (restart glitch-mind after changing it)

# Remote control lists this machine in the Claude app and at claude.ai/code. Off until REMOTE=1
# and a re-run of install.sh.
REMOTE=0
REMOTE_PERMISSION_MODE=auto   # for sessions started there: default | acceptEdits | auto | plan | dontAsk | bypassPermissions (restart glitch-remote after changing it)
REMOTE_IDLE_MIN=60       # minutes with no Claude activity (any session) before glitch-remote restarts to free its sessions

# The mutter speaks one of the agent's thoughts in Mandarin now and then during a turn. Off until
# MUTTER=1 and a re-run of install.sh, which downloads its voice. glitch-mind translates it, whatever MIND is.
MUTTER=0
MUTTER_VOICE="$DATA/voices/zh_CN-xiao_ya-medium.onnx"
MUTTER_EVERY=18          # seconds between mutters, at least
MUTTER_VOLUME=0.7        # desk loudness against the reply's 1.0

# The phone portal is off until `glitch phone` sets it up (PORTAL_ADDR and a certificate).
PORTAL_ADDR=""           # this machine's LAN address (e.g. 192.168.1.20), the only one it listens on
PORTAL_PORT=8443
PORTAL_CERT="$DATA/portal/cert.pem"   # TLS certificate (for PORTAL_ADDR) and key
PORTAL_KEY="$DATA/portal/key.pem"
PORTAL_APPROVE_TIMEOUT=300   # seconds a phone turn waits for Allow / Deny
# Appended to the voice prompt on phone turns.
PHONE_PROMPT="The user is on their phone, away from this computer. They hear SAY and read your full reply on the phone. They can't see or answer anything on this screen (pkexec dialogs, cards, the terminal). If a step needs that, stop, start SAY with \"Need you:\" and say it has to be done at the desk."
